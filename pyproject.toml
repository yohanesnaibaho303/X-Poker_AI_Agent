[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xpoker-agent"
version = "0.1.0"
description = "Inspectable agent for an authorized private X-Poker test table"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
  "websockets==15.0.1",
  "winrt-runtime==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation.Collections==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Globalization==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Graphics.Imaging==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Media.Ocr==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Storage.Streams==3.2.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.138.2",
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[project.scripts]
xpoker-agent = "xpoker_agent.main:run"
xpoker-simulate = "xpoker_agent.simulation:main"
xpoker-export-schemas = "xpoker_agent.schema_export:main"
xpoker-windows = "xpoker_agent.capture.cli:main"
xpoker-capture = "xpoker_agent.capture.recording:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.test-tmp/pytest"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
